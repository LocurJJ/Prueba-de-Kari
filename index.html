<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <title>Crear ilumina</title>
  <style>
    body{
      margin:0;
      font-family: Arial, sans-serif;
      background:#f7e6ff;
      color:#333;
      text-align:center;
    }

    header{
      background:#e5b8ff;
      padding:40px 20px;
    }

    h1{
      margin:0;
      font-size:42px;
    }

    .subtitulo{
      font-size:20px;
      font-style:italic;
    }

    .card{
      background:white;
      margin:25px auto;
      padding:25px;
      width:85%;
      max-width:500px;
      border-radius:20px;
      box-shadow:0 4px 12px #0002;
    }

    button{
      background:#d58cff;
      border:none;
      padding:15px 25px;
      border-radius:12px;
      font-size:18px;
      cursor:pointer;
      font-weight:bold;
    }

    button:hover{
      background:#c46bff;
    }

    .foto{
      width:250px;
      height:250px;
      border-radius:20px;
      object-fit:cover;
      background:#ddd;
      margin:15px auto;
      display:block;
    }
  </style>
</head>

<body>
<h1>Crear Ilunmina</h1>
  <p1>Ilumina tu evento con nosotros</p1>
  
  
</body>

</html>
