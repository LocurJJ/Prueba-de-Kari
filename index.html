<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <title>Crear ilumina</title>

  <style>
    body{
      margin:0;
      font-family: Arial, sans-serif;
      background:#f7e6ff;
      color:#333;
      text-align:center;
    }

    header{
      background:#e5b8ff;
      padding:40px 20px;
    }

    h1{
      margin:0;
      font-size:42px;
    }

    .subtitulo{
      font-size:20px;
      font-style:italic;
    }

    .card{
      background:white;
      margin:25px auto;
      padding:25px;
      width:85%;
      max-width:500px;
      border-radius:20px;
      box-shadow:0 4px 12px #0002;
    }

    button{
      background:#d58cff;
      border:none;
      padding:15px 25px;
      border-radius:12px;
      font-size:18px;
      cursor:pointer;
      font-weight:bold;
    }

    button:hover{
      background:#c46bff;
    }

    .foto{
      width:250px;
      height:250px;
      border-radius:20px;
      object-fit:cover;
      background:#ddd;
      margin:15px auto;
      display:block;
    }
  </style>
</head>

<body>

  <header>
    <h1>Crear ilumina</h1>
    <p class="subtitulo">Alquiler de letras luminosas</p>
  </header>

  <section class="card">
    <h2>Bienvenidos</h2>
    <p>Letras de madera luminosas para eventos, cumpleaños, casamientos y momentos especiales.</p>
    <p>📍 Hurlingham, Buenos Aires</p>
    <p>📞 15-3431-7772</p>
  </section>

  <section class="card">
    <h2>Galería</h2>
    <img class="foto" id="fotoGaleria" src="https://via.placeholder.com/250x250.png?text=Foto+1">

    <button onclick="fotoAnterior()">⬅</button>
    <button onclick="fotoSiguiente()">➡</button>
  </section>

  <section class="card">
    <h2>Stock disponible</h2>
    <p>Letras disponibles: <strong id="stock">100</strong></p>
    <p>Precio por letra: <strong>$10.000</strong></p>
  </section>

  <section class="card">
    <button onclick="iniciarSesion()">INICIAR SESIÓN</button>
  </section>

  <script>
  let fotos = [
  "Oh baby.png",
  "Foto 2.png",
  "Foto 3.png",
  "Foto 4.png",
  "Foto 5.png"
];

    let fotoActual = 0;

    function mostrarFoto(){
      document.getElementById("fotoGaleria").src = fotos[fotoActual];
    }

    function fotoSiguiente(){
      fotoActual++;
      if(fotoActual >= fotos.length){
        fotoActual = 0;
      }
      mostrarFoto();
    }

    function fotoAnterior(){
      fotoActual--;
      if(fotoActual < 0){
        fotoActual = fotos.length - 1;
      }
      mostrarFoto();
    }

    function iniciarSesion(){
      alert("Después armamos la pantalla de usuarios y contraseña");
    }
  </script>

</body>

</html>
